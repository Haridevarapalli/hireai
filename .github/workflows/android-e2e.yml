name: Android Appium E2E Tests & Report Generation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  android-e2e:
    name: Run Appium E2E Tests & Deploy Reports
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hireai_frontend/smarthire/package-lock.json

      - name: 3. Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Node Dependencies
        run: npm ci
        working-directory: hireai_frontend/smarthire

      - name: Install Appium and UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
        working-directory: hireai_frontend/smarthire

      - name: 6. Build SmartHire Android Debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: hireai_frontend/smarthire

      - name: 7. Start Android Emulator and Install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            adb devices
            adb install hireai_frontend/smarthire/android/app/build/outputs/apk/debug/app-debug.apk

      - name: 8. Start Appium Server
        run: |
          npx appium --port 4723 --base-path /wd/hub > appium.log 2>&1 &
          sleep 5
          curl -f http://127.0.0.1:4723/wd/hub/status
        working-directory: hireai_frontend/smarthire

      - name: 9. Start Next.js and Execute Appium E2E Tests
        id: run_tests
        continue-on-error: true
        env:
          BASE_URL: "http://10.0.2.2:3000"
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm run dev -- --hostname 0.0.0.0 --port 3000 > nextjs.log 2>&1 &
          sleep 15
          npm run test:e2e-mobile
        working-directory: hireai_frontend/smarthire

      - name: 10. Upload Test Result Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-e2e-test-results
          path: |
            hireai_frontend/smarthire/Test Results/Excel/Automation_Test_Report.xlsx
            hireai_frontend/smarthire/Test Results/HTML/execution-report.html
            hireai_frontend/smarthire/Test Results/Screenshots/
            hireai_frontend/smarthire/Test Results/Logs/
            hireai_frontend/smarthire/Test Results/Summary/summary.md
            hireai_frontend/smarthire/appium.log
            hireai_frontend/smarthire/nextjs.log
          retention-days: 30
          if-no-files-found: warn

      - name: Display GitHub Actions Execution Summary
        if: always()
        run: |
          SUMMARY_FILE="hireai_frontend/smarthire/Test Results/Summary/summary.md"

          echo "# Android Appium Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build Number: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Execution Date: $(date +'%Y-%m-%d')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/execution-report.html" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare GitHub Pages Reports
        if: always()
        run: |
          mkdir -p "gh-pages-reports/reports/latest/screenshots"
          mkdir -p "gh-pages-reports/reports/latest/logs"
          mkdir -p "gh-pages-reports/reports/history/build-${{ github.run_number }}"

          HTML_REPORT="hireai_frontend/smarthire/Test Results/HTML/execution-report.html"
          SUMMARY="hireai_frontend/smarthire/Test Results/Summary/summary.md"
          SCREENSHOTS="hireai_frontend/smarthire/Test Results/Screenshots"
          LOGS="hireai_frontend/smarthire/Test Results/Logs"

          if [ -f "$HTML_REPORT" ]; then
            cp "$HTML_REPORT" "gh-pages-reports/reports/latest/"
          fi

          if [ -f "$SUMMARY" ]; then
            cp "$SUMMARY" "gh-pages-reports/reports/latest/"
          fi

          if [ -d "$SCREENSHOTS" ]; then
            cp -r "$SCREENSHOTS"/. "gh-pages-reports/reports/latest/screenshots/" || true
          fi

          if [ -d "$LOGS" ]; then
            cp -r "$LOGS"/. "gh-pages-reports/reports/latest/logs/" || true
          fi

          cp -r "gh-pages-reports/reports/latest"/. \
            "gh-pages-reports/reports/history/build-${{ github.run_number }}/"

          cat > "gh-pages-reports/index.html" <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=reports/latest/execution-report.html">
            <title>SmartHire Appium Test Reports</title>
          </head>
          <body>
            <p>
              <a href="reports/latest/execution-report.html">
                Open Latest Appium Execution Report
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages-reports

      - name: 11. Publish HTML Reports to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

  baseline-load-test:
    name: Baseline / Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Django Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: hireai_backend

      - name: 4. Initialize & Seed Django Database
        run: |
          python manage.py migrate
          python seed_django.py
        working-directory: hireai_backend

      - name: 5. Start Django Backend Server
        run: |
          python manage.py runserver 0.0.0.0:8000 > django_server.log 2>&1 &
          sleep 5
          curl -f http://127.0.0.1:8000/ || curl -f http://localhost:8000/
        working-directory: hireai_backend

      - name: 6. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hireai_frontend/smarthire/package-lock.json

      - name: 7. Install Frontend Dependencies
        run: npm ci
        working-directory: hireai_frontend/smarthire

      - name: 8. Execute Baseline / Load Test (100 Users, 60s)
        id: run_load_test
        continue-on-error: true
        env:
          TEST_URL: "http://localhost:8000"
          CONNECTIONS: "100"
          DURATION: "60"
        run: npm run test:load
        working-directory: hireai_frontend/smarthire

      - name: 9. Display Load Testing Summary in GitHub Actions
        if: always()
        run: |
          SUMMARY_FILE="hireai_frontend/smarthire/Test Results/Summary/load_test_summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 10. Upload Load Test Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-load-test-results
          path: |
            hireai_frontend/smarthire/Test Results/Summary/load_test_summary.md
            hireai_frontend/smarthire/Test Results/Logs/load_test_execution.log
            hireai_backend/django_server.log
          retention-days: 30
          if-no-files-found: warn