name: Baseline / Load Testing

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    name: Baseline / Load Testing (100 Virtual Users - 60s)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Django Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: hireai_backend

      - name: 4. Initialize & Seed Django Database
        run: |
          python manage.py migrate
          python seed_django.py
        working-directory: hireai_backend

      - name: 5. Start Django Backend Server
        run: |
          python manage.py runserver 0.0.0.0:8000 > django_server.log 2>&1 &
          sleep 5
          curl -f http://127.0.0.1:8000/ || curl -f http://localhost:8000/
        working-directory: hireai_backend

      - name: 6. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hireai_frontend/smarthire/package-lock.json

      - name: 7. Install Frontend Dependencies
        run: npm ci
        working-directory: hireai_frontend/smarthire

      - name: 8. Execute Baseline / Load Test (100 Users, 60s)
        id: run_load_test
        continue-on-error: true
        env:
          TEST_URL: "http://localhost:8000"
          CONNECTIONS: "100"
          DURATION: "60"
        run: npm run test:load
        working-directory: hireai_frontend/smarthire

      - name: 9. Display Load Testing Summary in GitHub Actions
        if: always()
        run: |
          SUMMARY_FILE="hireai_frontend/smarthire/Test Results/Summary/load_test_summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Baseline / Load Testing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Result: FAIL (Report not generated)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 10. Upload Load Test Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-load-test-results
          path: |
            hireai_frontend/smarthire/Test Results/Summary/load_test_summary.md
            hireai_frontend/smarthire/Test Results/Logs/load_test_execution.log
            hireai_backend/django_server.log
          retention-days: 30
          if-no-files-found: warn
