name: Deploy to GitHub Pages & Run E2E Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smarthire/package-lock.json
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Install dependencies
        run: npm ci
        working-directory: smarthire

      - name: Build with Next.js
        run: npm run build
        working-directory: smarthire

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./smarthire/out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e-tests:
    name: Run Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smarthire/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: smarthire

      - name: Wait for Deployment to be Available
        run: |
          echo "Checking deployment URL: ${{ needs.deploy.outputs.page_url }}"
          timeout 120 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' ${{ needs.deploy.outputs.page_url }})" != "200" ]]; do sleep 5; done' || false
          echo "Deployment is up!"

      - name: Run Selenium Tests
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:e2e
        working-directory: smarthire

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            smarthire/Test Results/Excel/Automation_Test_Report.xlsx
            smarthire/Test Results/HTML/execution-report.html
            smarthire/Test Results/Screenshots/
            smarthire/Test Results/Logs/
            smarthire/Test Results/Summary/summary.md
          retention-days: 14
