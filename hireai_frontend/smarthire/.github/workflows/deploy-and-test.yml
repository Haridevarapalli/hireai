name: Deploy to GitHub Pages & Run Live E2E Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hireai_frontend/smarthire/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Dependencies
        run: npm ci
        working-directory: hireai_frontend/smarthire

      - name: Build with Next.js (Static Export)
        env:
          GITHUB_ACTIONS: "true"
          BASE_PATH: "/hireai"
        run: npm run build
        working-directory: hireai_frontend/smarthire

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./hireai_frontend/smarthire/out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e-tests:
    name: Run Selenium E2E Tests Against Live Site
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hireai_frontend/smarthire/package-lock.json

      - name: Setup Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Dependencies
        run: npm ci
        working-directory: hireai_frontend/smarthire

      - name: Verify Deployed URL returns HTTP 200
        run: |
          DEPLOY_URL="${{ needs.deploy.outputs.page_url }}"
          echo "===================================================="
          echo "Verifying deployment at URL: ${DEPLOY_URL}"
          echo "===================================================="
          
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}" || echo "000")
            echo "Attempt $i: HTTP status code is $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Live deployment verified! Status HTTP 200 OK."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for HTTP 200 from ${DEPLOY_URL}"
          exit 1

      - name: Run Selenium Headless E2E Tests
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:e2e
        working-directory: hireai_frontend/smarthire

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: hireai_frontend/smarthire/Test Results/
          retention-days: 14

      - name: Publish GitHub Actions Execution Summary
        if: always()
        run: |
          SUMMARY_FILE="hireai_frontend/smarthire/Test Results/Summary/summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "Summary file not found at $SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          fi
