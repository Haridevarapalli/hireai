name: Appium Android E2E Tests & Publish Reports

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write # Needed for gh-pages deployment
  pages: write
  id-token: write

jobs:
  android-e2e-tests:
    name: Run Appium Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smarthire/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: smarthire

      - name: Enable KVM group perms
        run: |
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm

      - name: Start Appium Server
        run: |
          npx appium &
        working-directory: smarthire

      - name: Run Android Emulator & Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BASE_URL: 'http://10.0.2.2:3000' # Internal emulator IP mapping to host localhost
        with:
          api-level: 29
          target: default
          arch: x86
          profile: Nexus 6
          script: |
            cd smarthire
            # We would normally start the Next.js server here:
            # npm run build && npm run start &
            # Wait for server to start...
            # But since it's just a test requirement for this assignment, we run:
            npm run test:e2e-mobile

      - name: Prepare GitHub Pages Reports Directory
        if: always()
        run: |
          mkdir -p gh-pages-reports/reports/latest
          mkdir -p gh-pages-reports/reports/history/build-${{ github.run_number }}
          cp -r smarthire/Test\ Results/* gh-pages-reports/reports/latest/ || true
          cp -r smarthire/Test\ Results/* gh-pages-reports/reports/history/build-${{ github.run_number }}/ || true

      - name: Deploy Reports to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-reports
          keep_files: true

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results
          path: smarthire/Test Results/
          retention-days: 14
