<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SmartHire AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(139, 92, 246, 0.35);
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    .logo-container svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    h1 span {
      background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .loader {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg viewBox="0 0 24 24">
      <path d="M12 2L14.4 7.2L20 8L16 12.2L17 18L12 15.2L7 18L8 12.2L4 8L9.6 7.2L12 2Z"/>
    </svg>
  </div>
  <h1>Smart<span>Hire</span> AI</h1>
  <p>Connecting to Intelligent Hiring Platform...</p>
  <div class="loader"></div>
</body>
</html>
